<!-- Hub v1.0 (07/11/2026): LEITURA do estoque e preços do EPI Manager. Não grava nada no banco. -->
<style>
:root{--m:#031335;--m2:#172C4B;--a:#F7DB1B;--bg:#F4F6FA;--ln:#D9DEE8;--aco:#5A6B85;--ok:#1F8A5B;--no:#B3261E}
*{box-sizing:border-box}body{margin:0;font:400 15px Inter,sans-serif;color:var(--m);background:var(--bg);padding-bottom:env(safe-area-inset-bottom)}
h1,h2,h3{font-family:Rubik,sans-serif;margin:0}
button,input{font:inherit}
.hide{display:none!important}
#login{position:relative;min-height:100vh;background:var(--m);display:flex;align-items:center;justify-content:center;padding:24px}
#login form{width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px;color:#fff}
#login img{width:72px;height:72px;border-radius:18px}
#login input{height:48px;border-radius:12px;border:0;padding:0 14px}
.btn{height:48px;border:0;border-radius:12px;background:var(--a);color:var(--m);font-weight:600;padding:0 20px;cursor:pointer}
.btn.o{background:transparent;border:2px solid var(--m)}
#err{color:#FFB4AB;min-height:20px;font-size:14px}
header{background:var(--m);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:12px}
#sticky-top{position:sticky;top:0;z-index:5}
header img{width:36px;height:36px;border-radius:9px}
header h1{font-size:18px;flex:1}
header small{color:#AEB9CC;font-size:12px;display:block;font-family:Inter}
header button{background:none;border:1px solid #5A6B85;color:#fff;border-radius:10px;padding:6px 12px;cursor:pointer}
main{max-width:900px;margin:0 auto;padding:16px}
nav{display:flex;gap:6px;overflow-x:auto;padding:12px 16px;max-width:900px;margin:0 auto;background:var(--bg)}
nav button{border:1px solid var(--ln);background:#fff;border-radius:999px;padding:8px 16px;font-weight:600;white-space:nowrap;cursor:pointer;color:var(--m)}
nav button.on{background:var(--m);color:#fff;border-color:var(--m)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.card{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:14px}
.k{font:700 24px Rubik,sans-serif}.l{font-size:12px;color:var(--aco)}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600}
.ok{background:var(--ok);color:#fff}.bx{background:var(--a);color:var(--m)}.sem{background:var(--no);color:#fff}.nd{background:var(--ln);color:var(--m)}
#q{width:100%;height:46px;border-radius:12px;border:1px solid var(--ln);padding:0 14px;margin-bottom:10px}
.fl{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.fl button{border:1px solid var(--ln);background:#fff;border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px;color:var(--m)}
.fl button.on{background:var(--a);border-color:var(--a);font-weight:600}
.list{display:flex;flex-direction:column;gap:10px}
.it{display:flex;justify-content:space-between;gap:10px;align-items:center;cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit}
.nm{font-weight:600}.pr{font-weight:600;margin-top:4px}
#sheet{position:fixed;inset:0;background:rgba(3,19,53,.55);display:flex;align-items:flex-end;justify-content:center;z-index:9}
#sheet>div{background:#fff;width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px;max-height:90vh;overflow:auto}
#sheet>div::before{content:'';display:block;width:40px;height:4px;background:var(--ln);border-radius:99px;margin:0 auto 16px}
.sp{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--ln);font-size:14px}
a.btn{display:flex;align-items:center;justify-content:center;text-decoration:none;margin-top:10px}
.th{width:60px;height:60px;border-radius:12px;object-fit:contain;background:#fff;border:1px solid var(--ln);flex:none}
.nf{display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--aco);background:var(--bg)}
.big{width:100%;height:200px;object-fit:contain;background:#fff;border:1px solid var(--ln);border-radius:14px;margin-bottom:12px}
.sz{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.sz div{border-radius:12px;padding:8px;text-align:center}.sz small{display:block;font-size:11px;font-weight:600}.sz b{font:700 18px Rubik,sans-serif}
.sz .ok{background:#E3F3EB}.sz .bx{background:var(--a)}.sz .sem{background:#F8DAD7}
.rw{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border-radius:10px;margin:6px 0;font-size:14px}.rw b{font-family:Rubik,sans-serif}.rw.ok{background:#E3F3EB}.rw.bx{background:var(--a)}.rw.sem{background:#F8DAD7}
.sec{font:700 16px Rubik,sans-serif;margin:20px 0 10px}.bar{height:8px;background:var(--ln);border-radius:99px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--a)}.bar.r i{background:var(--no)}
.lg{display:flex;gap:12px;font-size:12px;color:var(--aco);margin:10px 0;flex-wrap:wrap}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;border:1px solid var(--ln)}
.sz div,.rw.ok,.rw.bx,.rw.sem{color:var(--m)}.sz i{display:block;font-style:normal;font-size:10px;color:var(--aco)}.rw small{color:var(--aco)}
.hero{background:linear-gradient(135deg,#031335,#172C4B);color:#fff;border-radius:22px;padding:20px;display:flex;gap:18px;align-items:center}.hero h2{font-size:20px}.hero p{color:#C7D0DF;margin:6px 0 0;font-size:15px}
.car{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory}.car button{flex:none;width:150px;scroll-snap-align:start;background:#fff;border:1px solid var(--ln);border-radius:16px;padding:10px;text-align:left;cursor:pointer;color:var(--m)}
.car img,.car .nf{display:flex;width:100%;height:96px;object-fit:contain;border-radius:10px;background:#fff}.car .t{font:600 13px Inter,sans-serif;margin:8px 0 6px;height:34px;overflow:hidden}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tl{border:1px solid var(--ln);border-radius:18px;padding:16px;height:104px;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;font:700 16px Rubik,sans-serif;background:#fff;color:var(--m)}
.tl svg{width:28px;height:28px}.tl.y{background:var(--a);border-color:var(--a)}.tl.n{background:var(--m);border-color:var(--m);color:#fff}
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--ln)}.stack i{display:block;height:100%}.lg2{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:13px;color:var(--aco)}.lg2 i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.pw{position:relative}.pw input{width:100%;padding-right:96px}.pw button{position:absolute;right:6px;top:6px;height:36px;padding:0 12px;border:0;border-radius:8px;background:transparent;color:#031335;font-weight:600;cursor:pointer}
.inp{width:100%;height:46px;border-radius:12px;border:1px solid var(--ln);padding:0 12px;margin:4px 0 12px;background:#fff;color:var(--m)}textarea.inp{height:auto;padding:10px;line-height:1.4}.lbl{display:block;font-size:13px;font-weight:600;color:var(--aco)}
.row2{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.row2 .btn{flex:1;min-width:150px}.prev{display:none}
@media(min-width:900px){header{padding-left:max(16px,calc((100vw - 1100px)/2));padding-right:max(16px,calc((100vw - 1100px)/2))}main,nav{max-width:1100px}main{padding:24px 16px}
.list{display:grid;grid-template-columns:1fr 1fr;gap:12px}.kpis{grid-template-columns:repeat(4,1fr)}.tiles{grid-template-columns:repeat(4,1fr)}.hero{padding:28px 32px}.hero h2{font-size:26px}
#sheet{align-items:center}#sheet>div{border-radius:20px;max-width:560px}.car button{width:190px}.car img{height:120px}
.cli{display:grid;grid-template-columns:1fr 400px;gap:32px;align-items:start}.prev{display:block;position:sticky;top:96px}.phone{width:360px;height:700px;border:10px solid var(--m);border-radius:36px;overflow:hidden;background:#fff;margin:0 auto 10px}.phone iframe{width:100%;height:100%;border:0}}
#pvw{position:fixed;inset:0;z-index:70;background:rgba(3,19,53,.7);display:flex;align-items:center;justify-content:center}.pvb{background:#fff;width:100%;height:100%;display:flex;flex-direction:column}.pvh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--ln)}.pvh span{display:flex;gap:8px}.pvh .btn{height:40px;min-height:0;padding:0 12px;font-size:14px;margin:0!important}.pvb iframe{flex:1;border:0;width:100%}
@media(min-width:900px){.pvb{width:440px;height:min(92vh,860px);border-radius:24px;overflow:hidden}}
.vr{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:#AEB9CC;font-size:12px}
.oi{margin-bottom:10px}.orow{display:grid;grid-template-columns:90px 1fr 1fr;gap:8px;margin-top:8px}.orow label{font-size:12px;color:var(--aco);display:block}.orow input{width:100%;height:40px;border:1px solid var(--ln);border-radius:10px;padding:0 8px;margin-top:2px;font:inherit;color:var(--m)}.orow2{display:flex;justify-content:space-between;align-items:center;margin-top:8px}.rm{background:none;border:0;color:var(--aco);cursor:pointer;font-size:13px;text-decoration:underline;padding:8px}
.orc{max-width:720px}
.cap{font-size:12px;color:var(--aco);margin-top:14px}
</style>
</head>
